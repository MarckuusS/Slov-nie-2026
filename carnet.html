<style>
/* =============================================================
   Slovénie 2026 - feuille de style
   Mobile d'abord, pensée pour iPhone : zones sures, cibles de
   44 px, typographie fluide, aucun debordement horizontal.
   ============================================================= */

:root {
  --paper:      #F1F4EF;
  --surface:    #FFFFFF;
  --surface-2:  #E7EBE3;
  --glass:      rgba(241, 244, 239, .90);
  --ink:        #1A211E;
  --ink-soft:   #59635D;
  --ink-faint:  #87918A;
  --rule:       #D3DACF;
  --rule-soft:  #E4E9E0;
  --soca:       #0B6E63;
  --soca-lift:  #DEEFEA;
  --blaze:      #BB3728;
  --blaze-soft: #F7E5E2;
  --shadow:     0 1px 2px rgba(26,33,30,.06), 0 8px 20px -12px rgba(26,33,30,.22);
  --theme-color:#EAF1EC;
  --map-filter: saturate(.42) contrast(.93) brightness(1.05);
  --map-void:   #E4E9E0;

  --f-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-data: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --wrap: 44rem;
  /* Marges laterales. Valeurs simples, toujours appliquees.
     Les encoches s'ajoutent plus bas, dans un bloc @supports, avec
     env() ecrit directement dans la declaration. Faire transiter env()
     par une propriete personnalisee puis par un calc() marche sur
     Chrome mais invalide la declaration sur Safari : la marge tombe
     alors a zero et le texte colle au bord de l'ecran. */
  --gutter: 1.35rem;
  --pad: 1.35rem;
  --pad-r: 1.35rem;
  --tabbar: 3.55rem;
  --tap: 2.75rem;
  --top-h: 2.85rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper:      #0E1412;
    --surface:    #161E1B;
    --surface-2:  #1F2824;
    --glass:      rgba(14, 20, 18, .90);
    --ink:        #E5EBE6;
    --ink-soft:   #A4B0A9;
    --ink-faint:  #717D77;
    --rule:       #2A342F;
    --rule-soft:  #212A26;
    --soca:       #4FC7B1;
    --soca-lift:  #0F312B;
    --blaze:      #E4735F;
    --blaze-soft: #2F1A16;
    --shadow:     0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.7);
    --theme-color:#0E1412;
    --map-filter: invert(.92) hue-rotate(180deg) saturate(.4) brightness(.94) contrast(1.05);
    --map-void:   #1B2320;
  }
}

:root[data-theme="dark"] {
  --paper:      #0E1412;
  --surface:    #161E1B;
  --surface-2:  #1F2824;
  --glass:      rgba(14, 20, 18, .90);
  --ink:        #E5EBE6;
  --ink-soft:   #A4B0A9;
  --ink-faint:  #717D77;
  --rule:       #2A342F;
  --rule-soft:  #212A26;
  --soca:       #4FC7B1;
  --soca-lift:  #0F312B;
  --blaze:      #E4735F;
  --blaze-soft: #2F1A16;
  --shadow:     0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.7);
  --theme-color:#0E1412;
  --map-filter: invert(.92) hue-rotate(180deg) saturate(.4) brightness(.94) contrast(1.05);
  --map-void:   #1B2320;
}

:root[data-theme="light"] {
  --paper:      #F1F4EF;
  --surface:    #FFFFFF;
  --surface-2:  #E7EBE3;
  --glass:      rgba(241, 244, 239, .90);
  --ink:        #1A211E;
  --ink-soft:   #59635D;
  --ink-faint:  #87918A;
  --rule:       #D3DACF;
  --rule-soft:  #E4E9E0;
  --soca:       #0B6E63;
  --soca-lift:  #DEEFEA;
  --blaze:      #BB3728;
  --blaze-soft: #F7E5E2;
  --shadow:     0 1px 2px rgba(26,33,30,.06), 0 8px 20px -12px rgba(26,33,30,.22);
  --theme-color:#EAF1EC;
  --map-filter: saturate(.42) contrast(.93) brightness(1.05);
  --map-void:   #E4E9E0;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 1rem;
  line-height: 1.6;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

img, svg, table { max-width: 100%; }
p, li, td, th, h1, h2, h3, summary, span { overflow-wrap: break-word; }
a { color: var(--soca); }
:focus-visible { outline: 2px solid var(--soca); outline-offset: 2px; border-radius: 3px; }

.wrap {
  max-width: var(--wrap);
  margin: 0 auto;
  padding-left: var(--pad);
  padding-right: var(--pad-r);
}

.blaze {
  display: inline-block;
  width: .78rem; height: .78rem;
  border-radius: 50%;
  background: radial-gradient(circle, var(--surface) 0 36%, var(--blaze) 37% 100%);
  flex: none;
}

/* ================= barre du haut ================= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--rule);
  padding-top: 0;
}
.topbar-in {
  max-width: var(--wrap);
  margin: 0 auto;
  padding: .5rem var(--pad-r) .5rem var(--pad);
  display: flex; align-items: center; gap: .55rem;
  min-height: 2.85rem;
}
.topbar .mark {
  font-family: var(--f-data);
  font-size: .66rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex; align-items: center; gap: .45rem;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.now {
  margin-left: auto; flex: none;
  font-family: var(--f-data);
  font-size: .66rem; font-weight: 600; letter-spacing: .04em;
  color: var(--soca); background: var(--soca-lift);
  border-radius: 999px; padding: .24rem .6rem;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}

/* ================= panneaux ================= */
.panel { display: none; padding-bottom: 1rem; }
.panel.is-active { display: block; }
/* Raccourci `padding` interdit ici : six elements portent a la fois
   .block et .wrap, et un raccourci remettrait a zero les marges
   laterales posees par .wrap, qui est declare plus haut donc perdant a
   specificite egale. C'etait la cause du texte colle au bord. */
.block { padding-top: 1.7rem; padding-bottom: .2rem; }
.block:first-child { padding-top: 1.2rem; }

h1 {
  font-family: var(--f-display);
  font-size: clamp(2.1rem, 10vw, 3.1rem);
  line-height: .96; letter-spacing: -.022em; font-weight: 400;
  margin: 0; text-wrap: balance;
}
h1 em { font-style: italic; color: var(--soca); }
h2 {
  font-family: var(--f-display);
  font-size: clamp(1.4rem, 5.6vw, 1.75rem);
  font-weight: 400; letter-spacing: -.012em; line-height: 1.15;
  margin: 0 0 .35rem;
  display: flex; align-items: center; gap: .5rem;
  text-wrap: balance;
}
h3 {
  font-family: var(--f-body);
  font-size: .72rem; font-weight: 700; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-faint);
  margin: 1.7rem 0 .6rem;
}
.sub { color: var(--ink-soft); font-size: .92rem; margin: 0 0 1.1rem; max-width: 56ch; }
.fine { font-size: .8rem; color: var(--ink-faint); line-height: 1.5; }

/* ================= selecteur de jour ================= */
.dayrail {
  position: sticky;
  top: var(--top-h);
  z-index: 45;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--rule);
}
.dayrail-in {
  max-width: var(--wrap); margin: 0 auto;
  display: flex; gap: .35rem;
  overflow-x: auto; scrollbar-width: none;
  padding: .5rem var(--pad-r) .5rem var(--pad);
  -webkit-overflow-scrolling: touch;
}
.dayrail-in::-webkit-scrollbar { display: none; }
.daybtn {
  -webkit-appearance: none; appearance: none;
  flex: none;
  display: flex; flex-direction: column; align-items: flex-start;
  gap: .05rem;
  min-height: var(--tap);
  padding: .32rem .7rem;
  border: 1px solid var(--rule);
  border-left: 3px solid var(--dc, var(--rule));
  border-radius: 4px;
  background: var(--surface);
  color: var(--ink-soft);
  cursor: pointer; touch-action: manipulation;
  text-align: left;
}
.daybtn b {
  font-family: var(--f-data); font-size: .72rem; font-weight: 600;
  letter-spacing: .04em; color: var(--ink);
}
.daybtn span {
  font-family: var(--f-data); font-size: .56rem;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint);
}
.daybtn[aria-pressed="true"] { background: var(--soca-lift); border-color: var(--dc, var(--soca)); }
.daybtn[aria-pressed="true"] b { color: var(--ink); }
.daybtn.is-today::after {
  content: "auj.";
  font-family: var(--f-data); font-size: .5rem; letter-spacing: .1em;
  color: var(--blaze);
}

/* ================= carte ================= */
.mapwrap {
  position: sticky;
  /* juste sous la barre du haut et le selecteur de jour */
  top: calc(var(--top-h) + 3.8rem);
  z-index: 30;
  background: var(--paper);
  padding-bottom: .1rem;
}
.mapwrap.is-static { position: static; }
.mapwrap.is-static .mm { height: clamp(240px, 52vh, 520px); }

/* --- carte repliée : on rend toute la hauteur à l'itinéraire --- */
.mapwrap.is-folded .mm { height: 0; border-bottom: 0; }
.mapwrap.is-folded .mm-ctrl, .mapwrap.is-folded .mm-attrib, .mapwrap.is-folded .mm-styles { display: none; }

/* --- barre sous la carte : pli et état du tracé --- */
.maptools {
  max-width: var(--wrap); margin: 0 auto;
  display: flex; align-items: center; gap: .6rem;
  padding: .25rem var(--pad-r) .3rem var(--pad);
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
}
.foldbtn {
  -webkit-appearance: none; appearance: none;
  display: inline-flex; align-items: center; gap: .4rem;
  min-height: var(--tap); padding: .3rem .55rem .3rem .3rem;
  background: none; border: 0; color: var(--ink-soft);
  font-family: var(--f-data); font-size: .64rem;
  letter-spacing: .09em; text-transform: uppercase;
  cursor: pointer; touch-action: manipulation;
  white-space: nowrap; flex: none;
}
.foldbtn:active { color: var(--soca); }
.foldbtn .ic { width: 1rem; height: 1rem; transition: transform .2s ease; }
.foldbtn.is-folded .ic { transform: rotate(180deg); }
.maproute {
  margin-left: auto;
  font-family: var(--f-data); font-size: .6rem;
  letter-spacing: .05em; color: var(--ink-faint);
  text-align: right; min-width: 0;
}

/* --- plein écran --- */
.mapwrap.is-full {
  position: fixed; inset: 0; z-index: 90;
  display: flex; flex-direction: column;
  background: var(--paper);
  padding-top: 0;
  top: 0;
}
.mapwrap.is-full .mm { flex: 1 1 auto; height: auto; border-top: 0; }
.mapwrap.is-full .maptools { padding-bottom: .3rem; border-bottom: 0; border-top: 1px solid var(--rule); }
body.has-full { overflow: hidden; }
body.has-full .tabbar { display: none; }
.mm {
  position: relative;
  height: clamp(180px, 38vh, 360px);
  background: var(--map-void);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.mm:active { cursor: grabbing; }
.mm-inner { position: absolute; inset: 0; }
.mm-tiles { position: absolute; inset: 0; will-change: transform; }
.mm-tile {
  position: absolute;
  width: 256px; height: 256px;
  filter: var(--map-filter);
  opacity: 0;
  transition: opacity .25s ease;
  pointer-events: none;
}
.mm-tile.is-on { opacity: 1; }
.mm-tile.is-dead { display: none; }
.mm.is-flat .mm-tiles { display: none; }

.mm-svg { position: absolute; inset: 0; overflow: visible; }
.mm-halo { fill: none; stroke: var(--paper); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.mm-line { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.mm-line.is-dim { stroke-width: 2.5; opacity: .3; }
/* tronçon dont l'itinéraire routier n'est pas encore calculé */
.mm-line.is-rough { stroke-dasharray: 3 7; stroke-width: 3; opacity: .75; }
.mm-mark { cursor: pointer; }
.mm-ring { stroke: var(--paper); stroke-width: 2.5; }
.mm-mark.is-dim .mm-ring { opacity: .35; }
.mm-mark.is-active .mm-ring { stroke: var(--ink); stroke-width: 3; }
.mm-num {
  font-family: var(--f-data); font-size: 11px; font-weight: 700;
  fill: #fff; pointer-events: none;
}
.mm-hit { fill: transparent; }
/* fil entre la pastille ecartee et la position reelle de l'etape */
.mm-leader { stroke-width: 1.5; opacity: .55; }
.mm-anchor { stroke: var(--paper); stroke-width: 1.5; opacity: .9; }
.mm-mark.is-dim ~ .mm-leader, .mm-mark.is-dim ~ .mm-anchor { opacity: .3; }
.mm-mark:focus-visible .mm-ring { stroke: var(--blaze); stroke-width: 3.5; }

.mm-attrib {
  position: absolute; right: 0; bottom: 0; z-index: 5;
  font-family: var(--f-data); font-size: .55rem; letter-spacing: .04em;
  background: var(--glass); color: var(--ink-faint);
  padding: .15rem .4rem; text-decoration: none;
  border-top-left-radius: 4px;
}
.mm-ctrl {
  position: absolute; right: .5rem; top: .5rem; z-index: 5;
  display: grid; gap: .3rem;
}
.mm-ctrl button {
  -webkit-appearance: none; appearance: none;
  width: 2.1rem; height: 2.1rem;
  border-radius: 5px; border: 1px solid var(--rule);
  background: var(--glass);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: var(--ink); font-family: var(--f-data); font-size: 1.05rem; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; touch-action: manipulation;
}
.mm-ctrl button:active { background: var(--soca-lift); border-color: var(--soca); }
.mm-ctrl svg { width: 1rem; height: 1rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mm-ctrl button[aria-expanded="true"] { border-color: var(--soca); color: var(--soca); }

.mm-styles {
  position: absolute; right: 2.9rem; top: .5rem; z-index: 6;
  display: grid; gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule); border-radius: 5px; overflow: hidden;
  box-shadow: var(--shadow);
}
.mm-styles[hidden] { display: none; }
.mm-styles button {
  -webkit-appearance: none; appearance: none;
  background: var(--surface); border: 0; color: var(--ink);
  font-family: var(--f-data); font-size: .66rem; letter-spacing: .06em;
  padding: 0 .9rem; min-height: var(--tap); text-align: left;
  white-space: nowrap; cursor: pointer; touch-action: manipulation;
}
.mm-styles button[aria-pressed="true"] { background: var(--soca-lift); color: var(--soca); }
.mm-styles button:active { background: var(--surface-2); }

/* Le filtre dépend du fond : désature sur le plan et le relief pour que
   le tracé ressorte, laisse tel quel sur la vue satellite. */
.mm[data-style="satellite"] .mm-tile { filter: none; }
.mm[data-style="relief"] .mm-tile { filter: saturate(.6) contrast(.95) brightness(1.03); }
:root[data-theme="dark"] .mm[data-style="relief"] .mm-tile,
:root[data-theme="dark"] .mm[data-style="satellite"] .mm-tile { filter: brightness(.78) saturate(.8); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .mm[data-style="relief"] .mm-tile,
  :root:not([data-theme="light"]) .mm[data-style="satellite"] .mm-tile { filter: brightness(.78) saturate(.8); }
}

.maplegend {
  display: flex; flex-wrap: wrap; gap: .3rem .8rem;
  padding: .5rem var(--pad-r) .5rem var(--pad);
  max-width: var(--wrap); margin: 0 auto;
  font-family: var(--f-data); font-size: .6rem;
  letter-spacing: .06em; color: var(--ink-faint);
}
.maplegend i { display: inline-block; width: .8rem; height: .2rem; border-radius: 2px; vertical-align: middle; margin-right: .25rem; }

/* ================= entete de jour ================= */
.dayhead { padding-top: 1.1rem; }
.dayhead .kicker {
  font-family: var(--f-data); font-size: .62rem; letter-spacing: .15em;
  text-transform: uppercase; color: var(--soca);
  display: flex; align-items: center; gap: .45rem; margin: 0 0 .45rem;
}
.dayhead h2 { margin-bottom: .5rem; }
.dayhead .brief { font-family: var(--f-display); font-size: 1.02rem; font-style: italic; color: var(--ink-soft); line-height: 1.45; margin: 0 0 1rem; }

.daystats {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px; background: var(--rule);
  border: 1px solid var(--rule); border-radius: 5px; overflow: hidden;
}
.daystats div { background: var(--surface); padding: .55rem .5rem; min-width: 0; }
.daystats b {
  display: block; font-family: var(--f-data);
  font-size: clamp(.88rem, 4vw, 1.05rem); font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.daystats span {
  font-family: var(--f-data); font-size: .53rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-faint);
}

.startrow {
  display: flex; align-items: center; gap: .5rem;
  margin-top: .9rem; padding: .5rem .75rem;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 5px;
}
.startrow .lab { font-size: .85rem; color: var(--ink-soft); min-width: 0; }
.startrow .stepper { margin-left: auto; }

.stepper { display: flex; align-items: center; gap: .3rem; flex: none; }
.stepper button {
  -webkit-appearance: none; appearance: none;
  width: var(--tap); height: var(--tap); min-width: var(--tap);
  border-radius: 50%; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink);
  font-size: 1.1rem; line-height: 1; font-family: var(--f-data);
  cursor: pointer; touch-action: manipulation;
  display: flex; align-items: center; justify-content: center;
}
.stepper button:active { background: var(--soca-lift); border-color: var(--soca); }
.stepper output {
  font-family: var(--f-data); font-size: .95rem; font-weight: 600;
  font-variant-numeric: tabular-nums; min-width: 3.4rem; text-align: center;
}

.warnbar {
  border-left: 3px solid var(--blaze); background: var(--blaze-soft);
  border-radius: 0 5px 5px 0; padding: .7rem .9rem;
  font-size: .9rem; line-height: 1.5; margin-top: .9rem;
}

/* ================= choix A / B ================= */
.choice { display: grid; gap: .5rem; margin-top: 1rem; }
.choice > .lab { font-family: var(--f-data); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.choice .opts { display: grid; gap: .45rem; }
@media (min-width: 30rem) { .choice .opts { grid-template-columns: 1fr 1fr; } }
.optbtn {
  -webkit-appearance: none; appearance: none;
  text-align: left; padding: .65rem .8rem;
  border: 1px solid var(--rule); border-radius: 5px;
  background: var(--surface); color: var(--ink);
  min-height: var(--tap); cursor: pointer; touch-action: manipulation;
}
.optbtn b { display: block; font-size: .93rem; }
.optbtn span { font-size: .8rem; color: var(--ink-soft); line-height: 1.4; }
.optbtn[aria-pressed="true"] { border-color: var(--soca); background: var(--soca-lift); }

/* ================= timeline ================= */
.timeline { margin-top: 1.3rem; }

.stop {
  display: grid;
  grid-template-columns: 2.4rem minmax(0, 1fr);
  gap: .7rem;
  position: relative;
}

/* =============================================================

   Ce fichier est vide pour l'instant : l'application calcule les

   ouvrez l'onglet Carte, laissez le calcul se terminer, appuyez sur
   "Exporter les traces", et remplacez ce fichier par celui qui est
   telecharge. Un commit plus tard, plus aucun appel reseau n'est

   Geometrie OSRM, donnees OpenStreetMap, licence ODbL.
   ============================================================= */

window.ROUTES = {};

</script>
<script>
/* =============================================================
   Tracés routiers réels.

   Le tracé entre deux étapes suit les vraies routes, pas une ligne
   droite. La géométrie vient d'OSRM, le moteur de calcul d'itinéraire
   d'OpenStreetMap, interrogé par le navigateur.

   Comment ça marché :
   1. assets/routes.js peut contenir des tracés déjà figés. S'ils y
      sont, rien n'est demande au reseau, l'application est autonome.
   2. Sinon, chaque tronçon est demande une fois, simplifié, puis
      garde dans le stockage local du téléphone. Les fois suivantes,
      c'est instantané et ça marché sans reseau.
   3. Si le reseau ne répond pas, on retombe sur la ligne repérée par
      les points de passage saisis à la main : moins fidèle, mais
      lisible, et signalée en pointille dans l'application.

   Pour figer les tracés dans le dépôt : onglet Carte, bouton
   "Exporter les tracés", puis remplacer assets/routes.js par le
   fichier téléchargé.
   ============================================================= */

(function (global) {
  'use strict';

  var CACHE_KEY = 'slo2026.routes.v1';
  var ENDPOINT = 'https://router.project-osrm.org/route/v1/driving/';
  var PAUSE = 250;      // ms entre deux appels, pour rester poli
  var EPS = 0.00005;    // simplification, environ 5 m

  var mem = {};
  var pending = false;

  // 1. tracés figés livres avec le dépôt
  if (global.ROUTES) {
    Object.keys(global.ROUTES).forEach(function (k) { mem[k] = global.ROUTES[k]; });
  }
  // 2. tracés déjà recuperes sur cet appareil
  try {
    var stored = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
    Object.keys(stored).forEach(function (k) { if (!mem[k]) { mem[k] = stored[k]; } });
  } catch (e) { /* mode privé, navigation restreinte : tant pis */ }

  function key(a, b) {
    return a.lat.toFixed(4) + ',' + a.lon.toFixed(4) + '>' + b.lat.toFixed(4) + ',' + b.lon.toFixed(4);
  }

  function persist() {
    try {
      var out = {};
      Object.keys(mem).forEach(function (k) {
        if (!global.ROUTES || !global.ROUTES[k]) { out[k] = mem[k]; }
      });
      localStorage.setItem(CACHE_KEY, JSON.stringify(out));
    } catch (e) { /* quota plein : le tracé reste en mémoire pour la session */ }
  }

  /* --- Ramer-Douglas-Peucker, pour ne pas stocker 2000 points par tronçon --- */
  function segDist(p, a, b) {
    var x = a[0], y = a[1], dx = b[0] - x, dy = b[1] - y;
    if (dx || dy) {
      var t = ((p[0] - x) * dx + (p[1] - y) * dy) / (dx * dx + dy * dy);
      if (t > 1) { x = b[0]; y = b[1]; }
      else if (t > 0) { x += dx * t; y += dy * t; }
    }
    dx = p[0] - x; dy = p[1] - y;
    return dx * dx + dy * dy;
  }

  function simplify(pts, eps) {
    if (pts.length < 3) { return pts.slice(); }
    var sq = eps * eps;
    var keep = new Array(pts.length);
    keep[0] = keep[pts.length - 1] = true;
    var stack = [[0, pts.length - 1]];
    while (stack.length) {
      var seg = stack.pop(), first = seg[0], last = seg[1];
      var maxD = 0, idx = -1;
      for (var i = first + 1; i < last; i++) {
        var d = segDist(pts[i], pts[first], pts[last]);
        if (d > maxD) { maxD = d; idx = i; }
      }
      if (maxD > sq && idx > 0) {
        keep[idx] = true;
        stack.push([first, idx], [idx, last]);
      }
    }
    return pts.filter(function (p, i) { return keep[i]; });
  }

  function fetchLeg(a, b) {
    var url = ENDPOINT + a.lon + ',' + a.lat + ';' + b.lon + ',' + b.lat +
      '?overview=full&geometries=geojson&alternatives=false&steps=false';
    return fetch(url, { mode: 'cors' })
      .then(function (r) {
        if (!r.ok) { throw new Error('http ' + r.status); }
        return r.json();
      })
      .then(function (d) {
        if (d.code !== 'Ok' || !d.routes || !d.routes.length) { throw new Error('pas de route'); }
        var coords = d.routes[0].geometry.coordinates;   // [lon, lat]
        var pts = coords.map(function (c) { return [c[1], c[0]]; });
        pts = simplify(pts, EPS).map(function (p) {
          return [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5];
        });
        if (pts.length < 2) { throw new Error('tracé vide'); }
        mem[key(a, b)] = pts;
        return pts;
      });
  }

  var Router = {
    /** Tracé réel entre deux étapes, ou null s'il n'est pas encore connu. */
    get: function (a, b) { return mem[key(a, b)] || null; },

    has: function (a, b) { return !!mem[key(a, b)]; },

    /** Nombre de tronçons encore à récupérer dans la liste donnée. */
    missing: function (pairs) {
      return pairs.filter(function (p) { return !mem[key(p[0], p[1])]; }).length;
    },

    /**
     * Récupéré les tronçons manquants, un par un.
     * onStep(fait, total) est appelé après chaque tronçon obtenu,
     * pour redessiner la carte au fur et à mesure.
     */
    ensure: function (pairs, onStep) {
      if (pending || !global.fetch) { return; }
      var todo = pairs.filter(function (p) { return !mem[key(p[0], p[1])]; });
      if (!todo.length) { return; }

      pending = true;
      var total = todo.length, done = 0;

      function next() {
        if (!todo.length) {
          pending = false;
          persist();
          if (onStep) { onStep(done, total, true); }
          return;
        }
        var p = todo.shift();
        fetchLeg(p[0], p[1])
          .then(function () { done++; if (onStep) { onStep(done, total, false); } })
          .catch(function () { /* on garde la ligne de repli pour ce tronçon */ })
          .then(function () { setTimeout(next, PAUSE); });
      }
      next();
    },

    /** Contenu de assets/routes.js, pour figer les tracés dans le dépôt. */
    exportFile: function () {
      var keys = Object.keys(mem).sort();
      var lines = keys.map(function (k) {
        return '  ' + JSON.stringify(k) + ': ' + JSON.stringify(mem[k]) + ',';
      });
      return '/* =============================================================\n' +
        '   Tracés routiers figés, generes depuis l\'application.\n' +
        '   ' + keys.length + ' tronçons. Géométrie OSRM, données OpenStreetMap (ODbL).\n' +
        '\n' +
        '   Tant que ce fichier est rempli, l\'application n\'a plus besoin\n' +
        '   du reseau pour dessiner les itinéraires.\n' +
        '\n' +
        '   Pour le regenerer : onglet Carte, bouton Exporter les tracés.\n' +
        '   ============================================================= */\n\n' +
        'window.ROUTES = {\n' + lines.join('\n') + '\n};\n';
    },

    count: function () { return Object.keys(mem).length; }
  };

  global.Router = Router;
})(window);

</script>
<script>
/* =============================================================
   Moteur de carte minimal, sans aucune dépendance.

   Tuiles raster en projection Web Mercator, overlay SVG pour le
   tracé et les marqueurs numérotés. Gestes tactiles : glisser,
   pincer, double tap. Molette au bureau.

   Quatre fonds : Plan (OpenStreetMap), Relief (OpenTopoMap),
   Satellite (Esri) et Fond uni. Le fond uni n'est pas une panne,
   c'est un choix : le tracé y est plus lisible, et c'est ce qui
   reste quand il n'y a pas de reseau dans une vallée.
   ============================================================= */

(function (global) {
  'use strict';

  var TILE = 256;

  var STYLES = [
    {
      key: 'plan', name: 'Plan',
      url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      max: 18,
      credit: 'OpenStreetMap', creditUrl: 'https://www.openstreetmap.org/copyright'
    },
    {
      key: 'relief', name: 'Relief',
      url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      sub: ['à', 'b', 'c'], max: 16,
      credit: 'OpenTopoMap, CC-BY-SA', creditUrl: 'https://opentopomap.org/'
    },
    {
      key: 'satellite', name: 'Satellite',
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      max: 18,
      credit: 'Esri, Maxar, Earthstar Geographics', creditUrl: 'https://www.esri.com/'
    },
    {
      key: 'uni', name: 'Fond uni',
      url: null, max: 18,
      credit: null, creditUrl: null
    }
  ];

  function styleOf(key) {
    for (var i = 0; i < STYLES.length; i++) { if (STYLES[i].key === key) { return STYLES[i]; } }
    return STYLES[0];
  }

  function project(lat, lon, z) {
    var s = TILE * Math.pow(2, z);
    var sin = Math.sin(lat * Math.PI / 180);
    sin = Math.max(-0.9999, Math.min(0.9999, sin));
    return [
      (lon + 180) / 360 * s,
      (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s
    ];
  }

  function unproject(x, y, z) {
    var s = TILE * Math.pow(2, z);
    var n = Math.PI - 2 * Math.PI * y / s;
    return [
      180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n))),
      x / s * 360 - 180
    ];
  }

  function el(tag, cls) {
    var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (cls) { e.setAttribute('class', cls); }
    return e;
  }

  var ICON = {
    fit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg>',
    layer: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 21 8l-9 4.5L3 8z"/><path d="M3 12.5 12 17l9-4.5"/></svg>',
    full: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  function MiniMap(container, opts) {
    opts = opts || {};
    this.box = container;
    this.minZoom = opts.minZoom || 6;
    this.maxZoom = opts.maxZoom || 16;
    this.z = opts.zoom || 9;
    this.onPick = opts.onPick || function () {};
    this.onFull = opts.onFull || null;
    this.styleKey = opts.style || 'plan';

    this.box.classList.add('mm');
    this.box.innerHTML = '';
    this.box.setAttribute('data-style', this.styleKey);

    this.inner = document.createElement('div');
    this.inner.className = 'mm-inner';
    this.box.appendChild(this.inner);

    this.tileLayer = document.createElement('div');
    this.tileLayer.className = 'mm-tiles';
    this.inner.appendChild(this.tileLayer);

    this.svg = el('svg', 'mm-svg');
    this.svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    this.inner.appendChild(this.svg);

    this.gRoutes = el('g', 'mm-routes');
    this.gMarks = el('g', 'mm-marks');
    this.svg.appendChild(this.gRoutes);
    this.svg.appendChild(this.gMarks);

    this.attrib = document.createElement('à');
    this.attrib.className = 'mm-attrib';
    this.attrib.target = '_blank';
    this.attrib.rel = 'noopener';
    this.box.appendChild(this.attrib);

    this.ctrl = document.createElement('div');
    this.ctrl.className = 'mm-ctrl';
    this.ctrl.innerHTML =
      '<button type="button" data-mm="in" aria-label="Zoomer">+</button>' +
      '<button type="button" data-mm="out" aria-label="Dezoomer">-</button>' +
      '<button type="button" data-mm="fit" aria-label="Recadrer sur le tracé">' + ICON.fit + '</button>' +
      '<button type="button" data-mm="layer" aria-label="Changer de fond de carte" aria-expanded="false">' + ICON.layer + '</button>' +
      (this.onFull ? '<button type="button" data-mm="full" aria-label="Carte en plein écran">' + ICON.full + '</button>' : '');
    this.box.appendChild(this.ctrl);

    this.menu = document.createElement('div');
    this.menu.className = 'mm-styles';
    this.menu.hidden = true;
    this.menu.innerHTML = STYLES.map(function (st) {
      return '<button type="button" data-style="' + st.key + '">' + st.name + '</button>';
    }).join('');
    this.box.appendChild(this.menu);

    this.tiles = {};
    this.pointers = {};
    this.routes = [];
    this.marks = [];
    this.cx = 0; this.cy = 0;
    this.renderOX = 0; this.renderOY = 0;

    this._bind();
    this.setStyle(this.styleKey, true);
    this.setCenter(46.25, 14.0, this.z);
  }

  /* ---------- fonds de carte ---------- */

  MiniMap.prototype.setStyle = function (key, quiet) {
    var st = styleOf(key);
    this.styleKey = st.key;
    this.box.setAttribute('data-style', st.key);
    this.maxZoom = Math.min(this.maxZoom, st.max);
    if (this.z > st.max) { this.z = st.max; }

    if (st.credit) {
      this.attrib.hidden = false;
      this.attrib.href = st.creditUrl;
      this.attrib.textContent = 'Fond ' + st.credit;
    } else {
      this.attrib.hidden = true;
    }

    Array.prototype.forEach.call(this.menu.children, function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.style === st.key));
    });

    // on repart de zero : les tuiles de l'ancien fond ne sont pas reutilisables
    this.tileLayer.innerHTML = '';
    this.tiles = {};
    if (!quiet) { this.render(); }
  };

  MiniMap.prototype._tileUrl = function (st, z, x, y) {
    var u = st.url.replace('{z}', z).replace('{x}', x).replace('{y}', y);
    if (st.sub) { u = u.replace('{s}', st.sub[(x + y) % st.sub.length]); }
    return u;
  };

  /* ---------- géométrie ---------- */

  MiniMap.prototype._size = function () {
    var r = this.box.getBoundingClientRect();
    this.W = Math.max(1, Math.round(r.width));
    this.H = Math.max(1, Math.round(r.height));
    return r;
  };

  MiniMap.prototype.setCenter = function (lat, lon, z) {
    if (z != null) { this.z = Math.max(this.minZoom, Math.min(this.maxZoom, Math.round(z))); }
    var p = project(lat, lon, this.z);
    this.cx = p[0]; this.cy = p[1];
    this.render();
  };

  MiniMap.prototype.setRoutes = function (routes) { this.routes = routes || []; this.draw(); };
  MiniMap.prototype.setMarks = function (marks) { this.marks = marks || []; this.draw(); };

  MiniMap.prototype.bounds = function () {
    var pts = [];
    this.routes.forEach(function (r) { r.points.forEach(function (p) { pts.push(p); }); });
    this.marks.forEach(function (m) { pts.push([m.lat, m.lon]); });
    if (!pts.length) { return null; }
    var la1 = 90, la2 = -90, lo1 = 180, lo2 = -180;
    pts.forEach(function (p) {
      la1 = Math.min(la1, p[0]); la2 = Math.max(la2, p[0]);
      lo1 = Math.min(lo1, p[1]); lo2 = Math.max(lo2, p[1]);
    });
    return [la1, lo1, la2, lo2];
  };

  MiniMap.prototype.fit = function (pad) {
    var b = this.bounds();
    if (!b) { return; }
    this._size();
    pad = pad == null ? 46 : pad;
    var W = Math.max(40, this.W - pad * 2), H = Math.max(40, this.H - pad * 2);
    var z = this.maxZoom;
    for (; z > this.minZoom; z--) {
      var a = project(b[0], b[1], z), c = project(b[2], b[3], z);
      if (Math.abs(c[0] - a[0]) <= W && Math.abs(c[1] - a[1]) <= H) { break; }
    }
    this.z = z;
    var m1 = project(b[0], b[1], z), m2 = project(b[2], b[3], z);
    this.cx = (m1[0] + m2[0]) / 2;
    this.cy = (m1[1] + m2[1]) / 2;
    this.render();
  };

  /* ---------- rendu ---------- */

  MiniMap.prototype.render = function () {
    this._size();
    this.renderOX = this.cx - this.W / 2;
    this.renderOY = this.cy - this.H / 2;
    this.inner.style.transform = '';
    this.tileLayer.style.transform = '';
    this._tiles();
    this.draw();
  };

  MiniMap.prototype._tiles = function () {
    var st = styleOf(this.styleKey);
    if (!st.url) {
      this.tileLayer.innerHTML = '';
      this.tiles = {};
      return;
    }
    var z = this.z, n = Math.pow(2, z);
    var ox = this.renderOX, oy = this.renderOY;
    var x0 = Math.floor(ox / TILE) - 1, x1 = Math.floor((ox + this.W) / TILE) + 1;
    var y0 = Math.floor(oy / TILE) - 1, y1 = Math.floor((oy + this.H) / TILE) + 1;
    var need = {}, self = this;

    for (var x = x0; x <= x1; x++) {
      for (var y = y0; y <= y1; y++) {
        if (y < 0 || y >= n) { continue; }
        var tx = ((x % n) + n) % n;
        var key = st.key + '/' + z + '/' + tx + '/' + y + '/' + x;
        need[key] = 1;
        if (!this.tiles[key]) {
          var img = new Image();
          img.className = 'mm-tile';
          img.alt = '';
          img.decoding = 'async';
          img.style.left = (x * TILE - ox) + 'px';
          img.style.top = (y * TILE - oy) + 'px';
          img.addEventListener('load', function () { this.classList.add('is-on'); });
          img.addEventListener('error', function () { this.classList.add('is-dead'); });
          img.src = this._tileUrl(st, z, tx, y);
          this.tileLayer.appendChild(img);
          this.tiles[key] = img;
        } else {
          this.tiles[key].style.left = (x * TILE - ox) + 'px';
          this.tiles[key].style.top = (y * TILE - oy) + 'px';
        }
      }
    }
    Object.keys(this.tiles).forEach(function (k) {
      if (!need[k]) {
        var t = self.tiles[k];
        if (t && t.parentNode) { t.parentNode.removeChild(t); }
        delete self.tiles[k];
      }
    });
  };

  MiniMap.prototype.draw = function () {
    if (!this.W) { this._size(); }
    var z = this.z, self = this;
    this.svg.setAttribute('width', this.W);
    this.svg.setAttribute('height', this.H);
    this._viewBox();

    this.gRoutes.innerHTML = '';
    this.gMarks.innerHTML = '';

    this.routes.forEach(function (r) {
      if (!r.points || r.points.length < 2) { return; }
      var d = r.points.map(function (p, i) {
        var q = project(p[0], p[1], z);
        return (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
      }).join(' ');

      if (!r.link) {
        var halo = el('path', 'mm-halo');
        halo.setAttribute('d', d);

      var line = el('path', 'mm-line' + (r.dim ? ' is-dim' : '') +
        (r.rough ? ' is-rough' : '') + (r.link ? ' is-link' : ''));
      line.setAttribute('d', d);
      line.setAttribute('stroke', r.color || '#0C7367');
      self.gRoutes.appendChild(line);
    });

    // Deux etapes peuvent tomber au meme endroit : on part de la base le
    // matin et on y revient le soir. Sans decalage, le dernier marqueur
    // recouvre le premier et le numero 1 disparait. On ecarte donc les
    // pastilles qui se chevauchent, en tirant un fil vers le vrai point.
    var poses = [];
    function placer(q) {
      var R = 27, x = q[0], y = q[1];
      for (var essai = 0; essai < 32; essai++) {
        var libre = true;
        for (var k = 0; k < poses.length; k++) {
          if (Math.abs(poses[k][0] - x) < R && Math.abs(poses[k][1] - y) < R &&
              Math.hypot(poses[k][0] - x, poses[k][1] - y) < R) { libre = false; break; }
        }
        if (libre) { break; }
        var angle = essai * 2.39996;                       // angle d'or
        var rayon = R * (1 + Math.floor(essai / 7) * 0.75);
        x = q[0] + Math.cos(angle) * rayon;
        y = q[1] + Math.sin(angle) * rayon;
      }
      poses.push([x, y]);
      return [x, y];
    }

    this.marks.forEach(function (m, i) {
      var vrai = project(m.lat, m.lon, z);
      var q = placer(vrai);
      var decale = Math.hypot(q[0] - vrai[0], q[1] - vrai[1]) > 3;

      if (decale) {
        var fil = el('line', 'mm-leader');
        fil.setAttribute('x1', vrai[0].toFixed(1)); fil.setAttribute('y1', vrai[1].toFixed(1));
        fil.setAttribute('x2', q[0].toFixed(1)); fil.setAttribute('y2', q[1].toFixed(1));
        fil.setAttribute('stroke', m.color || '#0C7367');
        self.gMarks.appendChild(fil);
        var ancre = el('circle', 'mm-anchor');
        ancre.setAttribute('cx', vrai[0].toFixed(1)); ancre.setAttribute('cy', vrai[1].toFixed(1));
        ancre.setAttribute('r', 3);
        ancre.setAttribute('fill', m.color || '#0C7367');
        self.gMarks.appendChild(ancre);
      }

      var g = el('g', 'mm-mark' + (m.active ? ' is-active' : '') + (m.dim ? ' is-dim' : ''));
      g.setAttribute('transform', 'translate(' + q[0].toFixed(1) + ',' + q[1].toFixed(1) + ')');
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', m.label ? (m.label + '. ' + m.name) : m.name);

      var ring = el('circle', 'mm-ring');
      ring.setAttribute('r', m.active ? 15 : 12);
      ring.setAttribute('fill', m.color || '#0C7367');
      g.appendChild(ring);

      if (m.label) {
        var t = el('text', 'mm-num');
        t.setAttribute('y', 4);
        t.setAttribute('text-anchor', 'middle');
        t.textContent = m.label;
        g.appendChild(t);
      }

      var hit = el('circle', 'mm-hit');
      hit.setAttribute('r', 22);
      g.appendChild(hit);

      g.addEventListener('click', function (ev) { ev.stopPropagation(); self.onPick(m, i); });
      g.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); self.onPick(m, i); }
      });
      self.gMarks.appendChild(g);
    });
  };

  MiniMap.prototype._viewBox = function () {
    var ox = this.cx - this.W / 2, oy = this.cy - this.H / 2;
    this.svg.setAttribute('viewBox', ox + ' ' + oy + ' ' + this.W + ' ' + this.H);
  };

  MiniMap.prototype._pan = function () {
    var ox = this.cx - this.W / 2, oy = this.cy - this.H / 2;
    this.tileLayer.style.transform =
      'translate3d(' + (this.renderOX - ox) + 'px,' + (this.renderOY - oy) + 'px,0)';
    this._viewBox();
  };

  MiniMap.prototype.zoomAt = function (dz, px, py) {
    var nz = Math.max(this.minZoom, Math.min(this.maxZoom, this.z + dz));
    if (nz === this.z) { return; }
    var ox = this.cx - this.W / 2, oy = this.cy - this.H / 2;
    var ll = unproject(ox + px, oy + py, this.z);
    this.z = nz;
    var q = project(ll[0], ll[1], nz);
    this.cx = q[0] - px + this.W / 2;
    this.cy = q[1] - py + this.H / 2;
    this.render();
  };

  /* ---------- gestes et commandes ---------- */

  MiniMap.prototype.closeMenu = function () {
    this.menu.hidden = true;
    var b = this.ctrl.querySelector('[data-mm="layer"]');
    if (b) { b.setAttribute('aria-expanded', 'false'); }
  };

  MiniMap.prototype._bind = function () {
    var self = this;
    var mode = null, last = null, pinch = null, tapT = 0, tapX = 0, tapY = 0, moved = 0;

    function local(ev) {
      var r = self.box.getBoundingClientRect();
      return [ev.clientX - r.left, ev.clientY - r.top];
    }
    function inChrome(ev) {
      return ev.target.closest && ev.target.closest('.mm-ctrl, .mm-attrib, .mm-styles');
    }

    this.box.addEventListener('pointerdown', function (ev) {
      if (inChrome(ev)) { return; }
      self.closeMenu();
      self.box.setPointerCapture(ev.pointerId);
      self.pointers[ev.pointerId] = local(ev);
      var ids = Object.keys(self.pointers);
      if (ids.length === 1) {
        mode = 'pan'; last = self.pointers[ev.pointerId]; moved = 0;
      } else if (ids.length === 2) {
        var a = self.pointers[ids[0]], b = self.pointers[ids[1]];
        pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), mx: (a[0] + b[0]) / 2, my: (a[1] + b[1]) / 2, s: 1 };
        mode = 'pinch';
        self.inner.style.transformOrigin = pinch.mx + 'px ' + pinch.my + 'px';
      }
    });

    this.box.addEventListener('pointermove', function (ev) {
      if (!self.pointers[ev.pointerId]) { return; }
      self.pointers[ev.pointerId] = local(ev);
      if (mode === 'pan') {
        var p = self.pointers[ev.pointerId];
        var dx = p[0] - last[0], dy = p[1] - last[1];
        moved += Math.abs(dx) + Math.abs(dy);
        self.cx -= dx; self.cy -= dy;
        last = p;
        self._pan();
      } else if (mode === 'pinch') {
        var ids = Object.keys(self.pointers);
        if (ids.length < 2) { return; }
        var a = self.pointers[ids[0]], b = self.pointers[ids[1]];
        var d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        pinch.s = Math.max(0.4, Math.min(3.2, d / pinch.d));
        self.inner.style.transform = 'scale(' + pinch.s + ')';
      }
    });

    function end(ev) {
      if (!self.pointers[ev.pointerId]) { return; }
      delete self.pointers[ev.pointerId];
      var ids = Object.keys(self.pointers);

      if (mode === 'pinch' && ids.length < 2) {
        var dz = Math.round(Math.log(pinch.s) / Math.LN2);
        self.inner.style.transform = '';
        mode = null;
        if (dz) { self.zoomAt(dz, pinch.mx, pinch.my); } else { self.render(); }
        return;
      }

      if (mode === 'pan' && ids.length === 0) {
        mode = null;
        var p = local(ev), now = Date.now();
        if (moved < 12) {
          if (now - tapT < 300 && Math.hypot(p[0] - tapX, p[1] - tapY) < 32) {
            tapT = 0;
            self.zoomAt(1, p[0], p[1]);
            return;
          }
          tapT = now; tapX = p[0]; tapY = p[1];
        }
        self.render();
      }
    }

    this.box.addEventListener('pointerup', end);
    this.box.addEventListener('pointercancel', end);

    this.box.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      var p = local(ev);
      self.zoomAt(ev.deltaY < 0 ? 1 : -1, p[0], p[1]);
    }, { passive: false });

    this.ctrl.addEventListener('click', function (ev) {
      var b = ev.target.closest('button');
      if (!b) { return; }
      var a = b.dataset.mm;
      if (a === 'in') { self.closeMenu(); self.zoomAt(1, self.W / 2, self.H / 2); }
      if (a === 'out') { self.closeMenu(); self.zoomAt(-1, self.W / 2, self.H / 2); }
      if (a === 'fit') { self.closeMenu(); self.fit(); }
      if (a === 'full') { self.closeMenu(); self.onFull(); }
      if (a === 'layer') {
        self.menu.hidden = !self.menu.hidden;
        b.setAttribute('aria-expanded', String(!self.menu.hidden));
      }
    });

    this.menu.addEventListener('click', function (ev) {
      var b = ev.target.closest('button');
      if (!b) { return; }
      self.setStyle(b.dataset.style);
      self.closeMenu();
      if (self.onStyle) { self.onStyle(b.dataset.style); }
    });

    var t = null;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(function () { self.render(); }, 150);
    });
  };

  MiniMap.prototype.styles = function () { return STYLES; };

  global.MiniMap = MiniMap;
  global.MAP_STYLES = STYLES;
})(window);

</script>
<script>
/* =============================================================
   Slovénie 2026 - logique de l'application

(function (global) {
  'use strict';

  /* ---------- utilitaires ---------- */

  var $ = function (s, r) { return (r || document).querySelector(s); };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function eur(n) {
    var v = Math.round(n * 10) / 10;
    return (Math.abs(v - Math.round(v)) < 0.05 ? Math.round(v) : v.toFixed(1).replace('.', ',')) + ' €';
  }

  function hm(mins) {
    mins = Math.max(0, Math.round(mins));
    var h = Math.floor(mins / 60), m = mins % 60;
    if (!h) { return m + ' min'; }
    return h + 'h' + (m ? String(m).padStart(2, '0') : '');
  }

  function clock(mins) {
    mins = ((Math.round(mins) % 1440) + 1440) % 1440;
    return String(Math.floor(mins / 60)).padStart(2, '0') + 'h' + String(mins % 60).padStart(2, '0');
  }

  function parseClock(s) {
    var p = String(s).split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1] || '0', 10);
  }

  /* ---------- stockage ---------- */

  var KEY = 'slo2026.dash';
  var db = {};
  try { db = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { db = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

  /* ---------- couleur de la barre système iOS ---------- */

  function paintThemeColor() {
    var c = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim();
    var m = document.querySelector('meta[name="theme-color"]');
    if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
    m.setAttribute('content', c || '#EAF1EC');
  }
  paintThemeColor();
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) { mq.addEventListener('change', function () { paintThemeColor(); redrawMaps(); }); }
  }
  new MutationObserver(function () { paintThemeColor(); redrawMaps(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* ---------- liens externes ---------- */

  function gmaps(stop) {
    return 'https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent(stop.name + ', Slovénie');
  }
  function waze(stop) {
    return 'https://www.waze.com/ul?ll=' + stop.lat + '%2C' + stop.lon + '&navigate=yes&zoom=15';
  }
  function tripadvisor(stop) {
    return 'https://www.tripadvisor.fr/Search?q=' + encodeURIComponent(stop.name + ' Slovénie');
  }
  function itineraire(a, b) {
    return 'https://www.google.com/maps/dir/?api=1&origin=' + a.lat + ',' + a.lon +
      '&destination=' + b.lat + ',' + b.lon + '&travelmode=driving';
  }

  var IC = {
    map: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    nav: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-7z"/></svg>',
    star: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></svg>',
    web: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>',
    car: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16.5h14M6.5 16.5v2M17.5 16.5v2"/><path d="M4.5 16.5 6 11h12l1.5 5.5z"/><circle cx="8" cy="13.8" r=".6"/><circle cx="16" cy="13.8" r=".6"/></svg>'
  };

  function linkRow(stop) {
    var out = '<div class="links">';
    out += '<a href="' + gmaps(stop) + '" target="_blank" rel="noopener">' + IC.map + 'Fiche Maps</a>';
    out += '<a href="' + waze(stop) + '" target="_blank" rel="noopener">' + IC.nav + 'Waze</a>';
    out += '<a href="' + tripadvisor(stop) + '" target="_blank" rel="noopener">' + IC.star + 'Avis</a>';
    if (stop.site) {
      out += '<a href="' + esc(stop.site) + '" target="_blank" rel="noopener">' + IC.web + 'Site officiel</a>';
    }
    out += '</div>';
    return out;
  }

  /* ---------- état du voyage ---------- */

  var START = new Date(2026, 8, 7);
  var todayIdx = -1;
  (function () {
    var n = new Date();
    var t = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var off = Math.round((t - START) / 86400000);
    var el = $('#now');
    if (off < 0) { el.textContent = 'J-' + Math.abs(off); }
    else if (off > 6) { el.textContent = 'terminé'; }
    else { todayIdx = off; el.textContent = 'Jour ' + (off + 1) + ' . ' + TRIP.days[off].wd.split(' ')[0]; }
  })();

  /* ---------- calcul d'une journée ---------- */

  function variantOf(day) {
    if (!day.choice) { return null; }
    return db['var' + day.n] || day.choice.options[0].key;
  }
  function isOptOff(day, name) { return !!db['off' + day.n + '|' + name]; }
  function startOf(day) { return db['start' + day.n] != null ? db['start' + day.n] : parseClock(day.start); }

  function build(day) {
    var v = variantOf(day);
    var seq = day.stops.filter(function (s) { return !s.variant || s.variant === v; });

    // Une étape retirée ne casse pas la chaîne : ses deux tronçons sont
    // fusionnés, et le trajet résultant est signalé comme approximatif.
    var items = [], pend = null;
    seq.forEach(function (s, idx) {
      var skipped = !!(s.optional && isOptOff(day, s.name));
      if (!skipped) {
        items.push({ s: s, inLeg: pend });
        pend = null;
      } else if (pend) {
        pend.via = pend.via.concat([[s.lat, s.lon]]);
        pend.merged = true;
      }
      if (s.leg && idx < seq.length - 1) {
        if (!pend) { pend = { km: 0, min: 0, via: [], merged: false }; }
        pend.km += s.leg.km;
        pend.min += s.leg.min;
        pend.via = pend.via.concat(s.leg.via || []);
      }
    });

    var t = startOf(day);
    var rows = [], km = 0, drive = 0, onsite = 0, cost = 0;

    items.forEach(function (it, i) {
      var s = it.s;
      var row = { s: s, arrive: t, depart: t + s.stay };
      onsite += s.stay;
      cost += (s.cost || 0);
      t = row.depart;
      var nxt = items[i + 1];
      if (nxt && nxt.inLeg) {
        row.leg = {
          km: nxt.inLeg.km, min: nxt.inLeg.min, via: nxt.inLeg.via,
          merged: nxt.inLeg.merged, to: nxt.s
        };
        km += nxt.inLeg.km; drive += nxt.inLeg.min; t += nxt.inLeg.min;
      }
      rows.push(row);
    });

    return {
      rows: rows, stops: items.map(function (x) { return x.s; }),
      km: km, drive: drive, onsite: onsite, cost: cost, end: t, variant: v
    };
  }

  // Un objet tracé par tronçon : la vraie géométrie routière si elle est
  // connue, sinon la ligne repérée par les points de passage, signalée
  // en pointille pour que la difference se voie.
  // au-dela d'environ 60 m, l'ecart merite d'etre montre
  function ecarte(p, q) {
    return Math.abs(p[0] - q[0]) > 0.00055 || Math.abs(p[1] - q[1]) > 0.0008;
  }

  function routesOf(day, dim) {
    var out = [];
    build(day).rows.forEach(function (r) {
      if (!r.leg) { return; }
      var reel = global.Router ? Router.get(r.s, r.leg.to) : null;
      if (reel) {
        out.push({ points: reel, color: day.color, dim: dim, rough: false });
        // OSRM raccroche l'itineraire a la route la plus proche. Quand le
        // point de l'etape est a l'ecart, on relie les deux en pointille
        // fin : ce bout-la se fait a pied, ce n'est pas un decalage.
        var depart = [r.s.lat, r.s.lon], fin = [r.leg.to.lat, r.leg.to.lon];
        if (ecarte(depart, reel[0])) {
          out.push({ points: [depart, reel[0]], color: day.color, dim: dim, link: true });
        }
        if (ecarte(fin, reel[reel.length - 1])) {
          out.push({ points: [reel[reel.length - 1], fin], color: day.color, dim: dim, link: true });
        }
      } else {
        var pts = [[r.s.lat, r.s.lon]]
          .concat(r.leg.via || [])
          .concat([[r.leg.to.lat, r.leg.to.lon]]);
        out.push({ points: pts, color: day.color, dim: dim, rough: true });
      }
    });
    return out;
  }

  function legPairs(day) {
    var out = [];
    build(day).rows.forEach(function (r) { if (r.leg) { out.push([r.s, r.leg.to]); } });
    return out;
  }

  /* ---------- cartes ---------- */

  var dayMap = null, allMap = null, curDay = 0, activeStop = -1;

  function redrawMaps() {
    if (dayMap) { dayMap.draw(); }
    if (allMap) { allMap.draw(); }
  }

  function paintDayMap(garderCadre) {
    if (!dayMap) { return; }
    var day = TRIP.days[curDay];
    var b = build(day);
    dayMap.setRoutes(routesOf(day, false));
    dayMap.setMarks(b.stops.map(function (s, i) {
      return {
        lat: s.lat, lon: s.lon, label: String(i + 1), name: s.name,
        color: day.color, active: i === activeStop, idx: i
      };
    }));
    if (!garderCadre) { dayMap.fit(); }
    majEtatTrace();
  }

  function paintAllMap(garderCadre) {
    if (!allMap) { return; }
    var routes = [], marks = [];
    TRIP.days.forEach(function (day, i) {
      routes = routes.concat(routesOf(day, false));
      var b = build(day);
      var mid = b.stops[Math.min(1, b.stops.length - 1)];
      marks.push({
        lat: mid.lat, lon: mid.lon, label: String(day.n), name: 'Jour ' + day.n + ' : ' + day.title,
        color: day.color, day: i
      });
    });
    allMap.setRoutes(routes);
    allMap.setMarks(marks);
    if (!garderCadre) { allMap.fit(34); }
    majEtatTrace();
  }

  /* ---------- récupération des tracés routiers ---------- */

  function toutesLesPaires() {
    var out = [];
    TRIP.days.forEach(function (d) { out = out.concat(legPairs(d)); });
    return out;
  }

  function majEtatTrace(msg) {
    var el = document.getElementById('maproute');
    if (!el) { return; }
    if (msg) { el.textContent = msg; return; }
    if (!global.Router) { el.textContent = ''; return; }
    var reste = Router.missing(legPairs(TRIP.days[curDay]));
    el.textContent = reste
      ? reste + ' tronçon' + (reste > 1 ? 's' : '') + ' approximatif' + (reste > 1 ? 's' : '')
      : 'Itinéraire routier réel';
  }

  function chercherTraces(pairs, repeindre) {
    if (!global.Router) { return; }
    var reste = Router.missing(pairs);
    if (!reste) { majEtatTrace(); return; }
    majEtatTrace('Calcul des itinéraires, 0/' + reste);
    Router.ensure(pairs, function (fait, total, fini) {
      if (fini) { repeindre(true); majEtatTrace(); }
      else {
        majEtatTrace('Calcul des itinéraires, ' + fait + '/' + total);
        repeindre(true);
      }
    });
  }

  /* ---------- rendu du selecteur de jour ---------- */

  function renderRail() {
    var rail = $('#dayrail');
    rail.innerHTML = TRIP.days.map(function (d, i) {
      return '<button type="button" class="daybtn' + (i === todayIdx ? ' is-today' : '') +
        '" style="--dc:' + d.color + '" data-d="' + i + '" aria-pressed="' + (i === curDay) + '">' +
        '<b>J' + d.n + '</b><span>' + esc(d.wd.split(' ').slice(0, 2).join(' ')) + '</span></button>';
    }).join('');
    rail.addEventListener('click', function (ev) {
      var b = ev.target.closest('.daybtn');
      if (!b) { return; }
      selectDay(parseInt(b.dataset.d, 10));
    });
  }

  function syncRail() {
    $$('#dayrail .daybtn').forEach(function (b) {
      var on = parseInt(b.dataset.d, 10) === curDay;
      b.setAttribute('aria-pressed', String(on));
      if (on) { b.scrollIntoView({ block: 'nearest', inline: 'center' }); }
    });
  }

  /* ---------- rendu d'une journée ---------- */

  function renderDay() {
    var day = TRIP.days[curDay];
    var b = build(day);
    var host = $('#daybody');
    var out = '';

    out += '<div class="dayhead">';
    out += '<p class="kicker"><span class="blaze"></span> Jour ' + day.n + ' . ' + esc(day.wd) +
      (curDay === todayIdx ? " . aujourd'hui" : '') + '</p>';
    out += '<h2>' + esc(day.title) + '</h2>';
    out += '<p class="brief">' + esc(day.brief) + '</p>';

    out += '<div class="daystats">' +
      '<div><b>' + b.km + '</b><span>km</span></div>' +
      '<div><b>' + hm(b.drive) + '</b><span>conduite</span></div>' +
      '<div><b>' + hm(b.onsite) + '</b><span>sur place</span></div>' +
      '<div><b>' + eur(b.cost) + '</b><span>dépense</span></div>' +
      '</div>';

    out += '<div class="startrow"><span class="lab">Départ de la journée<br><small style="color:var(--ink-faint)">Fin estimée ' +
      clock(b.end) + ' . base ' + esc(day.base) + '</small></span>' +
      '<span class="stepper">' +
      '<button type="button" data-start="-15" aria-label="Partir 15 minutes plus tôt">-</button>' +
      '<output>' + clock(startOf(day)) + '</output>' +
      '<button type="button" data-start="15" aria-label="Partir 15 minutes plus tard">+</button>' +
      '</span></div>';

    if (day.warn) { out += '<div class="warnbar">' + esc(day.warn) + '</div>'; }

    if (day.choice) {
      out += '<div class="choice"><span class="lab">' + esc(day.choice.label) + '</span><div class="opts">';
      day.choice.options.forEach(function (o) {
        out += '<button type="button" class="optbtn" data-var="' + o.key + '" aria-pressed="' +
          (b.variant === o.key ? 'true' : 'false') + '"><b>' + esc(o.title) + '</b><span>' + esc(o.detail) + '</span></button>';
      });
      out += '</div></div>';
    }
    out += '</div>';

    /* --- timeline --- */
    out += '<div class="timeline">';
    b.rows.forEach(function (r, i) {
      var s = r.s;
      out += '<div class="stop' + (s.optional ? ' is-opt' : '') + '" data-i="' + i + '">';
      out += '<div class="gutter"><span class="pin" style="background:' + day.color + '">' + (i + 1) + '</span><span class="thread"></span></div>';
      out += '<div class="stopcard' + (i === activeStop ? ' is-active' : '') + '">';

      out += '<div class="stoptop"><span class="stoptime">' + clock(r.arrive) +
        (s.stay ? ' - ' + clock(r.depart) : '') + '</span>';
      if (s.stay) { out += '<span class="stopdur">' + hm(s.stay) + ' sur place</span>'; }
      out += '</div>';

      out += '<div class="stopname">' + esc(s.name) + '</div>';
      if (s.sub) { out += '<div class="stopsub">' + esc(s.sub) + '</div>'; }

      out += '<div class="badges"><span class="badge kind">' + esc(s.kind) + '</span>';
      if (s.free) { out += '<span class="badge">gratuit</span>'; }
      else if (s.cost) { out += '<span class="badge pay">' + eur(s.cost) + '</span>'; }
      if (s.booking) { out += '<span class="badge book">à réserver</span>'; }
      if (s.optional) { out += '<span class="badge">optionnel</span>'; }
      out += '</div>';

      if (s.tip) { out += '<p class="stoptip">' + esc(s.tip) + '</p>'; }

      out += linkRow(s);

      if (s.optional) {
        out += '<div class="links"><button type="button" data-skip="' + esc(s.name) + '">Retirer de la journée</button></div>';
      }
      out += '</div></div>';

      if (r.leg) {
        out += '<div class="leg"><div class="legline"><i></i></div><div class="legbody">' +
          IC.car + (r.leg.merged ? 'environ ' : '') + '<b>' + r.leg.km + ' km</b> . <b>' + hm(r.leg.min) +
          '</b> vers ' + esc(r.leg.to.name) +
          '<a href="' + itineraire(s, r.leg.to) + '" target="_blank" rel="noopener">' + IC.nav + 'Itinéraire</a>' +
          '</div></div>';
      }
    });

    /* étapes optionnelles retirées */
    var removed = day.stops.filter(function (s) {
      return s.optional && isOptOff(day, s.name) && (!s.variant || s.variant === b.variant);
    });
    if (removed.length) {
      out += '<h3>Retiré de cette journée</h3><div class="links">';
      removed.forEach(function (s) {
        out += '<button type="button" data-add="' + esc(s.name) + '">Remettre ' + esc(s.name) + '</button>';
      });
      out += '</div>';
    }
    out += '</div>';

    host.innerHTML = out;
    paintDayMap();
  }

  function onDayClick(ev) {
    var day = TRIP.days[curDay];
    var t;

    if ((t = ev.target.closest('[data-start]'))) {
      var d = parseInt(t.dataset.start, 10);
      db['start' + day.n] = Math.max(4 * 60, Math.min(14 * 60, startOf(day) + d));
      save(); renderDay(); return;
    }
    if ((t = ev.target.closest('[data-var]'))) {
      db['var' + day.n] = t.dataset.var; save(); activeStop = -1; renderDay(); return;
    }
    if ((t = ev.target.closest('[data-skip]'))) {
      db['off' + day.n + '|' + t.dataset.skip] = true; save(); activeStop = -1; renderDay(); return;
    }
    if ((t = ev.target.closest('[data-add]'))) {
      delete db['off' + day.n + '|' + t.dataset.add]; save(); activeStop = -1; renderDay(); return;
    }
    if ((t = ev.target.closest('.stop'))) {
      if (ev.target.closest('à, button')) { return; }
      var i = parseInt(t.dataset.i, 10);
      activeStop = (activeStop === i) ? -1 : i;
      $$('#daybody .stopcard').forEach(function (c, k) { c.classList.toggle('is-active', k === activeStop); });
      if (dayMap && activeStop >= 0) {
        var b = build(day), s = b.stops[activeStop];
        dayMap.setCenter(s.lat, s.lon, Math.max(dayMap.z, 12));
        paintDayMap();
        $('#daymap').scrollIntoView({ block: 'nearest' });
      } else { paintDayMap(); }
    }
  }

  function selectDay(i) {
    curDay = Math.max(0, Math.min(TRIP.days.length - 1, i));
    activeStop = -1;
    db.day = curDay; save();
    syncRail();
    renderDay();
    chercherTraces(legPairs(TRIP.days[curDay]), function () { paintDayMap(true); });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  /* ---------- onglet carte globale ---------- */

  function renderAll() {
    var host = $('#allbody');
    var totalKm = 0, totalDrive = 0, totalCost = 0;
    TRIP.days.forEach(function (d) { var b = build(d); totalKm += b.km; totalDrive += b.drive; totalCost += visitesOf(d); });

    var out = '<div class="block wrap"><h2><span class="blaze"></span> Le circuit complet</h2>' +
      '<p class="sub">Une boucle au départ de Ljubljana. Touchez un numéro sur la carte pour ouvrir la journée.</p>' +
      '<div class="daystats">' +
      '<div><b>' + totalKm + '</b><span>km</span></div>' +
      '<div><b>' + hm(totalDrive) + '</b><span>conduite</span></div>' +
      '<div><b>7</b><span>jours</span></div>' +
      '<div><b>' + eur(totalCost) + '</b><span>visites</span></div>' +
      '</div>';

    out += '<h3>Les sept étapes</h3><div class="tablewrap"><table><thead><tr>' +
      '<th>Jour</th><th>Étape</th><th class="num">Route</th></tr></thead><tbody>';
    TRIP.days.forEach(function (d, i) {
      var b = build(d);
      out += '<tr data-open="' + i + '" style="cursor:pointer">' +
        '<td><span class="puce" style="background:' + d.color + '"></span>J' + d.n + '</td>' +
        '<td>' + esc(d.title) + '<br><span class="fine">' + esc(d.base) + '</span></td>' +
        '<td class="num">' + b.km + ' km<br><span class="fine">' + hm(b.drive) + '</span></td></tr>';
    });
    out += '</tbody></table></div>';

    out += '<h3>Distances utiles</h3><div class="tablewrap"><table><tbody>' +
      '<tr><td>Aéroport LJU vers Bled</td><td class="num">35 km . 35 min</td></tr>' +
      '<tr><td>Bled vers lac de Bohinj</td><td class="num">30 km . 35 min</td></tr>' +
      '<tr><td>Bohinj vers Kranjska Gora</td><td class="num">65 km . 1h15</td></tr>' +
      '<tr><td>Kranjska Gora vers sommet du Vrsic</td><td class="num">13 km . 40 min</td></tr>' +
      '<tr><td>Vrsic vers source de la Soca</td><td class="num">12 km . 30 min</td></tr>' +
      '<tr><td>Bovec vers Kobarid</td><td class="num">21 km . 25 min</td></tr>' +
      '<tr><td>Kobarid vers Skocjan</td><td class="num">145 km . 2h20</td></tr>' +
      '<tr><td>Skocjan vers Ljubljana</td><td class="num">75 km . 55 min</td></tr>' +
      '<tr><td>Ljubljana vers aéroport</td><td class="num">26 km . 28 min</td></tr>' +
      '</tbody></table></div>';

    out += '<h3>Les tracés routiers</h3>' +
      '<p class="fine">Les itinéraires suivent les vraies routes. Ils sont calculés une fois par OSRM, ' +
      'le moteur d\'itinéraire d\'OpenStreetMap, puis gardes sur ce téléphone : ensuite ça marché sans reseau. ' +
      'Un tronçon en pointille signifie qu\'il n\'a pas encore été calculé.</p>' +
      '<p class="fine">Pour les figer dans le dépôt et ne plus jamais dépendre du reseau : exportez le fichier, ' +
      'puis remplacez assets/routes.js par celui qui est téléchargé.</p>' +
      '<button class="btn" id="export-routes" type="button">Exporter les tracés</button> ' +
      '<span class="fine" id="export-etat"></span>';

    out += '<h3>Carte hors ligne</h3>' +
      '<p class="fine">Les tuiles déjà affichées sont gardées automatiquement : ce que vous avez regarde ' +
      'reste visible sans reseau. Vous pouvez aussi télécharger d\'un coup tout le corridor du voyage, ' +
      'pour ne pas être aveugles dans la vallée de la Soca ou sur le Vrsic.</p>' +
      '<div class="chips">' +
      '<button type="button" class="chip" data-off="12">Le tracé</button>' +
      '<button type="button" class="chip" data-off="13">Détaillé</button>' +
      '</div>' +
      '<div class="meter" id="off-meter"><i></i></div>' +
      '<p class="fine" id="off-avancee"></p>' +
      '<p class="fine" id="off-etat"></p>' +
      '<button class="btn" id="off-vider" type="button">Vider le cache des tuiles</button>' +
      '<p class="fine" style="margin-top:.8rem">A faire chez vous, en wifi, avant de partir. ' +
      'Le téléchargement se limité au corridor de l\'itinéraire et au fond de carte choisi. ' +
      'Les serveurs de tuiles sont mis à disposition gracieusement : c\'est prévu pour être lance une fois.</p>';

    out += '</div>';

    host.innerHTML = out;
    host.addEventListener('click', function (ev) {
      var tr = ev.target.closest('[data-open]');
      if (tr) {
        selectDay(parseInt(tr.dataset.open, 10));
        showTab('jours');
        return;
      }
      if (ev.target.closest('#export-routes')) { exporterTraces(); return; }
      var off = ev.target.closest('[data-off]');
      if (off) { telechargerHorsLigne(parseInt(off.dataset.off, 10)); return; }
      if (ev.target.closest('#off-vider')) {
        envoyerSW({ type: 'VIDER' });
        $('#off-meter').querySelector('i').style.width = '0%';
        $('#off-avancee').textContent = '';
        return;
      }
    });

    if (swDisponible()) { demanderEtat(); }
    else { var e = $('#off-etat'); if (e) { e.textContent = 'Le cache hors ligne demande une adresse https : ouvrez l\'application depuis GitHub Pages.'; } }

    var leg = $('#maplegend');
    leg.innerHTML = TRIP.days.map(function (d) {
      return '<span><i style="background:' + d.color + '"></i>J' + d.n + '</span>';
    }).join('');
  }

  function exporterTraces() {
    var etat = $('#export-etat');
    if (!global.Router || !Router.count()) {
      etat.textContent = 'Aucun tracé calculé pour l\'instant.';
      return;
    }
    var blob = new Blob([Router.exportFile()], { type: 'text/javascript' });
    var url = URL.createObjectURL(blob);
    var lien = document.createElement('à');
    lien.href = url; lien.download = 'routes.js';
    document.body.appendChild(lien); lien.click(); lien.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    etat.textContent = Router.count() + ' tronçons exportes.';
  }

  /* ---------- carte hors ligne ---------- */

  var sw = null;

  function styleCourant() {
    var k = db.style || 'plan';
    var liste = global.MAP_STYLES || [];
    for (var i = 0; i < liste.length; i++) { if (liste[i].key === k) { return liste[i]; } }
    return liste[0];
  }

  function tuileXY(lat, lon, z) {
    var n = Math.pow(2, z);
    var r = lat * Math.PI / 180;
    return [
      Math.floor((lon + 180) / 360 * n),
      Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)
    ];
  }

  // Échantillonné le tracé tous les ~1 km pour ne pas laisser de trous
  // entre deux points éloignés, puis liste les tuiles du corridor.
  function tuilesDuVoyage(zMax) {
    var st = styleCourant();
    if (!st || !st.url) { return []; }

    var pts = [];
    TRIP.days.forEach(function (d) {
      routesOf(d, false).forEach(function (r) {
        for (var i = 0; i < r.points.length - 1; i++) {
          var a = r.points[i], b = r.points[i + 1];
          var d2 = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));
          var pas = Math.max(1, Math.ceil(d2 / 0.01));
          for (var k = 0; k < pas; k++) {
            pts.push([a[0] + (b[0] - a[0]) * k / pas, a[1] + (b[1] - a[1]) * k / pas]);
          }
        }
        if (r.points.length) { pts.push(r.points[r.points.length - 1]); }
      });
    });

    var vues = {}, urls = [];
    for (var z = 8; z <= Math.min(zMax, st.max); z++) {
      var marge = z >= 12 ? 1 : 2;
      var n = Math.pow(2, z);
      for (var i = 0; i < pts.length; i++) {
        var t = tuileXY(pts[i][0], pts[i][1], z);
        for (var dx = -marge; dx <= marge; dx++) {
          for (var dy = -marge; dy <= marge; dy++) {
            var x = t[0] + dx, y = t[1] + dy;
            if (y < 0 || y >= n) { continue; }
            x = ((x % n) + n) % n;
            var cle = z + '/' + x + '/' + y;
            if (vues[cle]) { continue; }
            vues[cle] = 1;
            var u = st.url.replace('{z}', z).replace('{x}', x).replace('{y}', y);
            if (st.sub) { u = u.replace('{s}', st.sub[(x + y) % st.sub.length]); }
            urls.push(u);
          }
        }
      }
    }
    return urls;
  }

  function swDisponible() {
    return 'serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
  }

  function enregistrerSW() {
    if (!swDisponible()) { return; }
    navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});

    // Quand une nouvelle version prend la main, on recharge une seule
    // fois : sinon l'ancienne feuille de style reste servie depuis le
    // cache et les corrections n'arrivent jamais sur le telephone.
    var rechargeFaite = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (rechargeFaite) { return; }
      rechargeFaite = true;
      location.reload();
    });
    navigator.serviceWorker.ready.then(function (reg) {
      sw = reg.active || reg.waiting || reg.installing;
      demanderEtat();
    }).catch(function () {});
    navigator.serviceWorker.addEventListener('message', function (ev) {
      var m = ev.data || {};
      if (m.type === 'ETAT_CACHE') { majHorsLigne(m.tuiles); }
      if (m.type === 'PRECACHE_AVANCEE') { avanceeHorsLigne(m.fait, m.total); }
      if (m.type === 'PRECACHE_FINI') {
        avanceeHorsLigne(m.total, m.total);
        majHorsLigne(m.tuiles, m.echecs);
      }
    });
  }

  function envoyerSW(msg) {
    var c = navigator.serviceWorker && navigator.serviceWorker.controller;
    if (c) { c.postMessage(msg); return true; }
    if (sw) { sw.postMessage(msg); return true; }
    return false;
  }

  function demanderEtat() { envoyerSW({ type: 'ETAT_CACHE' }); }

  function majHorsLigne(tuiles, echecs) {
    var e = $('#off-etat');
    if (!e) { return; }
    var mo = Math.round(tuiles * 18 / 1024 * 10) / 10;
    e.textContent = tuiles
      ? tuiles + ' tuiles en cache, environ ' + String(mo).replace('.', ',') + ' Mo.' +
        (echecs ? ' ' + echecs + ' non récupérées.' : '')
      : 'Aucune tuile en cache pour l\'instant.';
  }

  function avanceeHorsLigne(fait, total) {
    var m = $('#off-meter');
    if (m) { m.querySelector('i').style.width = (fait / Math.max(1, total) * 100) + '%'; }
    var e = $('#off-avancee');
    if (e) { e.textContent = fait < total ? 'Téléchargement ' + fait + '/' + total : 'Téléchargement terminé.'; }
  }

  function telechargerHorsLigne(zMax) {
    var e = $('#off-avancee');
    if (!swDisponible()) {
      e.textContent = 'Le cache hors ligne demande une adresse https. Ouvrez l\'application depuis GitHub Pages.';
      return;
    }
    var urls = tuilesDuVoyage(zMax);
    if (!urls.length) {
      e.textContent = 'Choisissez d\'abord un fond de carte autre que le fond uni.';
      return;
    }
    if (!envoyerSW({ type: 'PRECACHE', urls: urls })) {
      e.textContent = 'Le cache se préparé, reessayez dans quelques secondes.';
      return;
    }
    e.textContent = 'Téléchargement 0/' + urls.length;
  }

  function computeBudget() {
    var fixeOther = BUDGET.fixe.reduce(function (a, f) { return a + f[1]; }, 0);
    var fixe = sim.car / 2 + fixeOther;
    var lit = (sim.nuit * 6) / 2;
    var food = sim.food * 7;
    var vis = visitesBase();
    $$('#extras input').forEach(function (x) { if (x.checked) { vis += parseFloat(x.dataset.cost); } });
    var total = fixe + lit + food + vis;

    $('#o-nuit').textContent = eur(sim.nuit);
    $('#o-food').textContent = eur(sim.food);
    $('#o-car').textContent = eur(sim.car);
    $('#b-total').textContent = eur(total);
    $('#b-fixe').textContent = eur(fixe);
    $('#b-lit').textContent = eur(lit);
    $('#b-food').textContent = eur(food);
    $('#b-vis').textContent = eur(vis);

    var m = $('#b-meter');
    m.querySelector('i').style.width = Math.min(100, total / BUDGET.cible * 100) + '%';
    m.classList.toggle('over', total > BUDGET.cible);
    var v = $('#b-verdict');
    if (total > BUDGET.cible) {
      v.className = 'verdict over';
      v.textContent = eur(total - BUDGET.cible) + ' au-dessus de la cible. Coupez un extra, ou une nuit en auberge.';
    } else {
      v.className = 'verdict ok';
      v.textContent = 'Il reste ' + eur(BUDGET.cible - total) + ' de marge sur les 600 €.';
    }
  }

  function computeSpend() {
    var sum = 0;
    $$('#spend input').forEach(function (i) {
      var n = parseFloat(String(i.value).replace(',', '.'));
      if (!isNaN(n) && n > 0) { sum += n; }
    });
    $('#s-total').textContent = eur(sum);
    var m = $('#s-meter');
    m.querySelector('i').style.width = Math.min(100, sum / BUDGET.cible * 100) + '%';
    m.classList.toggle('over', sum > BUDGET.cible);
    var v = $('#s-verdict');
    if (sum > BUDGET.cible) {
      v.className = 'verdict over';
      v.textContent = eur(sum - BUDGET.cible) + ' au-dessus de l\'enveloppe.';
    } else {
      v.className = 'verdict ok';
      v.textContent = 'Il reste ' + eur(BUDGET.cible - sum) + ' sur l\'enveloppe.';
    }
  }

    if (name === 'jours' && dayMap) {
      setTimeout(function () { dayMap.render(); paintDayMap(true); }, 30);
      chercherTraces(legPairs(TRIP.days[curDay]), function () { paintDayMap(true); });
    }
  }

  /* ---------- démarrage ---------- */

  function boot() {
    enregistrerSW();
    renderRail();
    renderAll();
    renderBudget();
    renderGuide();
    renderPack();

    dayMap = new MiniMap($('#daymap'), {
      minZoom: 8, maxZoom: 16,
      style: db.style || 'plan',
      onFull: function () { plierDeplier('#mapwrap', 'full', dayMap); },
      onPick: function (m) {
        activeStop = m.idx;
        $$('#daybody .stopcard').forEach(function (c, k) { c.classList.toggle('is-active', k === activeStop); });
        var card = $$('#daybody .stop')[activeStop];
        if (card) { card.scrollIntoView({ block: 'center' }); }
        paintDayMap(true);
      }
    });
    dayMap.onStyle = function (k) { db.style = k; save(); if (allMap) { allMap.setStyle(k); } };

    // replier la carte pour lire l'itinéraire en plus grand
    if (db.folded) { $('#mapwrap').classList.add('is-folded'); }
    majBoutonPli();
    $('#mapfold').addEventListener('click', function () {
      var w = $('#mapwrap');
      w.classList.toggle('is-folded');
      db.folded = w.classList.contains('is-folded'); save();
      majBoutonPli();
      if (!db.folded) { setTimeout(function () { dayMap.render(); paintDayMap(true); }, 30); }
    });

    curDay = (todayIdx >= 0) ? todayIdx : (db.day != null ? db.day : 0);
    $('#daybody').addEventListener('click', onDayClick);
    syncRail();
    renderDay();

    $$('.tabbar button').forEach(function (b) {
      b.addEventListener('click', function () { showTab(b.dataset.tab); });
    });

    var h = (location.hash || '').replace('#', '');
    showTab(TABS.indexOf(h) >= 0 ? h : (db.tab || 'jours'));
    window.addEventListener('hashchange', function () {
      var x = (location.hash || '').replace('#', '');
      if (TABS.indexOf(x) >= 0) { showTab(x); }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else { boot(); }
})(window);

</script>
</body>
</html>
